app = "gama-whatsapp-cloud"
primary_region = "scl"

[build]

[http_service]
  internal_port = 3015
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[env]
  PORT = "3015"
  NODE_ENV = "production"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
